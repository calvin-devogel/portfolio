<div class="chat-outer">
	<div main class="chat-page px-4">
		<div class="box chat-container">
			<h2 class="gradient-title title is-4 mb-4">Live Chat</h2>

			<div class="message-list" #messageList>
				@if (loadingMessages()) {
					<p class="has-text-centered has-text-grey py-6">Connecting...</p>
				} @else if (messages().length === 0) {
					<p class="has-text-centered has-text-grey py-6">
						No messages yet - say hi!
					</p>
				} @else {
					@for (message of messages(); track message.timestamp) {
						<div
							class="chat-message"
							[class.is-mine]="message.userId === currentUser()?.userId"
						>
							<div class="message-meta">
								<span class="username">{{ message.username }}</span>
								<span class="timestamp">
									<!-- pipes! -->
									{{ message.timestamp | date: 'shortTime' }}
								</span>
							</div>		
							<div class="text">{{ message.text }}</div>
						</div>
					}
				}
			</div>

			<div class="chat-input">
				<!-- two-way binding: [(ngModel)] -->
				<input
					class="input"
					type="text"
					placeholder="Type your message..."
					[(ngModel)]="newMessage"
					(keydown.enter)="send()"
					[disabled]="loadingMessages()"
				/>
				<button
					class="pill-button is-link"
					(click)="send()"
					[disabled]="!newMessage().trim() || loadingMessages()"
				>
					<i-feather name="Send" class="icon is-small mr-1" size="16" aria-hidden="true"/>
					Send
				</button>
			</div>
		</div>
	</div>
</div>
