<ng-template #modalTemplate>
    <div class="modal-overlay" (click)="onBackdropClick()">
        <div
            class="modal-base"
            [style.max-width]="modalMaxWidth()"
            [style.height]="modalHeight()"
            (click)="$event.stopPropagation()"
        >
            <div class="modal-header">
                <div class="modal-title">
                    @if (titleIconTemplate()) {
                        <ng-container [ngTemplateOutlet]="titleIconTemplate()"></ng-container>
                    }
                    <span>{{ title() }}</span>
                    @if (titleBadgeTemplate()) {
                        <ng-container [ngTemplateOutlet]="titleBadgeTemplate()"></ng-container>
                    }
                </div>
                <div class="modal-header-actions">
                    @if (actionsTemplate()) {
                        <ng-container [ngTemplateOutlet]="actionsTemplate()"></ng-container>
                    }
                    <button class="pill-button is-muted" (click)="closeModal()">
                        <i-feather name="x" size="14"></i-feather>
                    </button>
                </div>
            </div>

            <div class="modal-body">
                @if (bodyTemplate()) {
                    <ng-container [ngTemplateOutlet]="bodyTemplate()"></ng-container>
                }
            </div>
        </div>
    </div>
</ng-template>
