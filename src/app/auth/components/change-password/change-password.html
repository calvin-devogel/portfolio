<div class="container mt-5">
	<div class="box is-shadowless" style="max-width: 480px; margin: 0 auto">
		<h1 class="title is-4">Change Password</h1>
		<p class="subtitle is-6">You must set a new password before continuing.</p>

		<form (ngSubmit)="onSubmit()" autocomplete="off">
			<div class="field">
				<label class="label" for="currentPassword">Current password</label>
				<div class="control">
					<input
						class="input"
						type="password"
						name="currentPassword"
						[(ngModel)]="formData.currentPassword"
						autocomplete="current-password"
						required
					/>
				</div>
			</div>

			<div class="field">
				<label class="label" for="newPassword">New password</label>
				<div class="control">
					<input
						class="input"
						type="password"
						name="newPassword"
						[(ngModel)]="formData.newPassword"
						autocomplete="new-password"
						required
					/>
				</div>
			</div>

			<div class="field">
				<label class="label" for="confirmNewPassword">Confirm new password</label>
				<div class="control">
					<input
						class="input"
						type="password"
						name="confirmNewPassword"
						[(ngModel)]="formData.confirmNewPassword"
						autocomplete="new-password"
						required
					/>
				</div>
				@if (passwordMismatch()) {
					<p class="help is-danger">New password and confirmation do not match.</p>
				}
			</div>

			<button
				class="button is-link is-fullwidth"
				type="submit"
				[disabled]="busy() || passwordMismatch()"
				[class.is-loading]="busy()"
			>
				Change Password
			</button>
		</form>
	</div>
</div>
